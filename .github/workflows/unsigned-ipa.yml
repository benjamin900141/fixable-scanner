name: unsigned-ipa
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Archive the unsigned scanner
        working-directory: apps/ios
        run: sh build-ipa.sh
      - name: Refuse a file that cannot send a screen
        run: |
          set -e
          find apps/ios/build -type f | head -40
          APP=$(find apps/ios/build -type f \( -name FixableScanner -o -name Fixable \) | head -1)
          test -n "$APP"
          strings -a "$APP" > /tmp/narrow.txt
          strings -a -e l "$APP" > /tmp/wide.txt
          cat /tmp/narrow.txt /tmp/wide.txt | grep -F "/device/screen"
          cat /tmp/narrow.txt /tmp/wide.txt | grep -F "hearty-mammoth-35.convex.site"
          if cat /tmp/narrow.txt /tmp/wide.txt | grep -F "rapid-marmot-414"; then
            echo "The file points at the private server."
            exit 1
          fi
      - name: Replace the public iPhone file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload 0.1.0 apps/ios/build/Fixable.ipa --clobber --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Fixable-ipa
          path: apps/ios/build/Fixable.ipa
          if-no-files-found: error
