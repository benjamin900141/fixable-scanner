name: unsigned-ipa
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Archive the unsigned scanner
        working-directory: apps/ios
        run: sh build-ipa.sh
      - name: Refuse a file that cannot send a screen
        run: |
          set -e
          APP="apps/ios/build/Fixable.xcarchive/Products/Applications/FixableScanner.app/FixableScanner"
          test -f "$APP"
          export APP
          python3 - <<'PY'
          import os, pathlib
          data = pathlib.Path(os.environ["APP"]).read_bytes()
          def has(text):
              raw = text.encode()
              return raw in data or text.encode("utf-16le") in data or text.encode()[::-1] in data
          missing = [text for text in ("/device/screen", "hearty-mammoth-35.convex.site") if not has(text)]
          if missing:
              raise SystemExit("The built app cannot send a screen to the public server. Missing: " + ", ".join(missing))
          if has("rapid-marmot-414"):
              raise SystemExit("The file points at the private server.")
          print("The built app can send a screen to the public server.")
          PY
      - name: Replace the public iPhone file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload 0.1.0 apps/ios/build/Fixable.ipa --clobber --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Fixable-ipa
          path: apps/ios/build/Fixable.ipa
          if-no-files-found: error
