name: unsigned-ipa
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Archive the unsigned scanner
        working-directory: apps/ios
        run: sh build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Fixable-ipa
          path: apps/ios/build/Fixable.ipa
          if-no-files-found: error