name: signer-tls
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: "10.0.22621.0"

      - name: Setup Swift on Windows
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: "6.1.2"

      - name: Configure Windows SDK module maps
        shell: pwsh
        run: |
          if (Test-Path "$env:LOCALAPPDATA\clang\ModuleCache") {
            Remove-Item -Recurse -Force "$env:LOCALAPPDATA\clang\ModuleCache"
          }
          $share = "$env:SDKROOT\usr\share"
          $ucrtDir = "C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\ucrt"
          $umDir = "C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\um"
          Copy-Item "$share\ucrt.modulemap" "$ucrtDir\module.modulemap" -Force
          Copy-Item "$share\winsdk.modulemap" "$umDir\module.modulemap" -Force
          Copy-Item "$share\ucrt.apinotes" "$ucrtDir\ucrt.apinotes" -Force -ErrorAction SilentlyContinue
          Copy-Item "$share\winsdk.apinotes" "$umDir\winsdk.apinotes" -Force -ErrorAction SilentlyContinue

      - name: Fetch a public page
        shell: pwsh
        run: |
          @'
          import Foundation
          import FoundationNetworking
          @main
          enum Probe {
            static func main() {
              let sem = DispatchSemaphore(value: 0)
              let task = URLSession.shared.dataTask(with: URL(string: "https://www.apple.com")!) { _, response, error in
                if let error { print(error.localizedDescription); exit(1) }
                let status = (response as? HTTPURLResponse)?.statusCode ?? 0
                print(status)
                if status != 200 { exit(1) }
                sem.signal()
              }
              task.resume()
              sem.wait()
            }
          }
          '@ | Set-Content -Encoding ascii probe.swift
          swiftc -parse-as-library -o probe.exe probe.swift
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\probe.exe

      - name: Checkout SideSign
        uses: actions/checkout@v4
        with:
          repository: SideStore/SideSign
          ref: v0.1.7
          path: sidesign-src
          submodules: recursive

      - name: Install Unicorn and zlib
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\unicorn\include, C:\unicorn\lib | Out-Null
          Invoke-WebRequest -Uri "https://github.com/mahee96/unicorn/releases/download/2.1.4-multiarch/unicorn-windows-x64.zip" -OutFile C:\unicorn.zip
          Expand-Archive -Path C:\unicorn.zip -DestinationPath C:\unicorn -Force
          vcpkg install zlib:x64-windows-static --x-install-root=C:\vcpkg_installed
          $prefix = "C:\vcpkg_installed\x64-windows-static"
          Write-Host "lib files:"
          Get-ChildItem "$prefix\lib" -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
          $lib = Get-ChildItem "$prefix\lib\*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          $header = Get-ChildItem "$prefix\include" -Filter zlib.h -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $lib -or -not $header) {
            Write-Host "prefix files:"
            Get-ChildItem $prefix -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            exit 1
          }
          Write-Host "Using $($lib.FullName) and $($header.FullName)"
          Copy-Item $lib.FullName "C:\unicorn\lib\zlib.lib" -Force
          Copy-Item $lib.FullName "C:\unicorn\lib\z.lib" -Force
          Copy-Item $header.FullName "C:\unicorn\include\zlib.h" -Force
          $zconf = Join-Path $header.DirectoryName "zconf.h"
          if (Test-Path $zconf) { Copy-Item $zconf "C:\unicorn\include\zconf.h" -Force }
          if (Test-Path "C:\unicorn\include\zconf.h") {
            (Get-Content C:\unicorn\include\zconf.h) -replace '.*unistd\.h.*', '// #include <unistd.h>' | Set-Content C:\unicorn\include\zconf.h
          }
          "INCLUDE=$env:INCLUDE;C:\unicorn\include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIB=$env:LIB;C:\unicorn\lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the signer
        shell: pwsh
        working-directory: sidesign-src
        env:
          _CL_: "/D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
        run: |
          swift package resolve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $responseFile = Get-ChildItem -Path .build\checkouts -Recurse -Filter AnisetteDataResponse.swift | Select-Object -First 1
          if (-not $responseFile) { Write-Error "AnisetteDataResponse.swift was not fetched"; exit 1 }
          (Get-Item $responseFile.FullName).IsReadOnly = $false
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE ".github\AnisetteDataResponse.swift") $responseFile.FullName -Force
          $client = Get-ChildItem -Path .build\checkouts -Recurse -Filter AnisetteClient.swift | Select-Object -First 1
          if (-not $client) { Write-Error "AnisetteClient.swift was not fetched"; exit 1 }
          $text = [System.IO.File]::ReadAllText($client.FullName)
          $needle = "let (adiPbData, generatedBlob, cleanup) = try await resolveProvisioningBlob("
          $at = $text.IndexOf($needle)
          if ($at -lt 0) { Write-Error "The anisette client no longer has the expected request"; exit 1 }
          if (-not $text.Contains("Direct anisette headers were not available.")) {
            $item = Get-Item $client.FullName
            $item.IsReadOnly = $false
            $insert = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE ".github\anisette-v1.swift"))
            if (-not $insert.EndsWith("`n")) { $insert += "`n" }
            $text = $text.Insert($at, $insert + "        ")
            $fallback = 'if customHeaders?.clientInfo == nil { $0.clientInfo = self.clientInfo }'
            $kept = 'if customHeaders?.clientInfo == nil, !self.clientInfo.contains("macOS;") { $0.clientInfo = self.clientInfo }'
            if (-not $text.Contains($fallback)) { Write-Error "The default client header was not found"; exit 1 }
            $text = $text.Replace($fallback, $kept)
            [System.IO.File]::WriteAllText($client.FullName, $text)
          }
          $handler = Join-Path (Get-Location) "CLI\CommandHandler.swift"
          if (-not (Test-Path $handler)) { Write-Error "CommandHandler.swift was not fetched"; exit 1 }
          (Get-Item $handler).IsReadOnly = $false
          $handlerText = [System.IO.File]::ReadAllText($handler)
          $otpPrint = 'print("OneTimePassword:        \(data.oneTimePassword)")'
          if (-not $handlerText.Contains('print("ClientInfo:')) {
            if (-not $handlerText.Contains($otpPrint)) { Write-Error "The anisette print was not found"; exit 1 }
            $clientPrint = 'print("ClientInfo:            \(data.clientInfo)")' + "`r`n                " + $otpPrint
            $handlerText = $handlerText.Replace($otpPrint, $clientPrint)
            [System.IO.File]::WriteAllText($handler, $handlerText)
          }
          swift build -c release --disable-automatic-resolution `
            -Xcc -IC:\unicorn\include `
            -Xcc -DWIN32=1 `
            -Xcc -DZ_HAVE_UNISTD_H=0 `
            -Xcc -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH `
            -Xcxx -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH `
            -Xcc -D_CRT_SECURE_NO_WARNINGS `
            -Xcc -D_CRT_NONSTDC_NO_WARNINGS `
            -Xswiftc -D_CRT_SECURE_NO_WARNINGS `
            -Xswiftc -D_CRT_NONSTDC_NO_WARNINGS `
            -Xcxx -IC:\unicorn\include `
            -Xlinker /LIBPATH:C:\unicorn\lib `
            -Xlinker C:\unicorn\lib\zlib.lib `
            --product sidesign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem -Path .build -Filter sidesign.exe -Recurse | Where-Object { $_.FullName -like "*release*" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { Write-Error "sidesign.exe was not built"; exit 1 }
          Write-Host "Found binary at: $exe"
          function Test-Anisette($path) {
            $proc = Start-Process -FilePath $path -ArgumentList @("anisette","--server","https://mac-ani.jkcoxson.com") -NoNewWindow -PassThru -RedirectStandardOutput anisette-out.txt -RedirectStandardError anisette-err.txt
            if (-not $proc.WaitForExit(60000)) {
              Stop-Process -Id $proc.Id -Force
              Write-Error "The anisette request did not finish."
              exit 1
            }
            $out = (Get-Content anisette-out.txt, anisette-err.txt -ErrorAction SilentlyContinue | Out-String)
            Remove-Item anisette-out.txt, anisette-err.txt -ErrorAction SilentlyContinue
            if ($out -match "SEC_E_UNTRUSTED_ROOT") { Write-Host "The signer was rejected before it could read headers."; exit 1 }
            if ($out -match "WebSockets not supported") { Write-Host "The signer opened a socket instead of reading headers."; exit 1 }
            if ($out -match "macOS;") { Write-Host "The signer kept a rejected client header."; exit 1 }
            if ($out -notmatch "OneTimePassword" -or $out -notmatch "Mac OS X") { Write-Host "The signer did not keep the server client info."; exit 1 }
            Write-Host "Anisette headers arrived"
          }
          Test-Anisette $exe
          $bundle = Join-Path $env:GITHUB_WORKSPACE "signer-bundle"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item $exe (Join-Path $bundle "sidesign.exe")
          $swift = Split-Path (Get-Command swift).Source
          Copy-Item (Join-Path $swift "*.dll") $bundle -Force
          if (-not (Test-Path (Join-Path $bundle "FoundationNetworking.dll"))) {
            $hit = Get-ChildItem -Path "C:\hostedtoolcache\windows" -Filter FoundationNetworking.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $hit) { Write-Error "FoundationNetworking.dll was not found"; exit 1 }
            Copy-Item (Join-Path $hit.DirectoryName "*.dll") $bundle -Force
          }
          @'
          SideSign 0.1.7 is GPL-3.0. The Swift 6.1.2 runtime beside it is Apache-2.0.
          The Apple ID password is typed on this computer and sent only to Apple.
          The Windows build reads the anisette server's existing headers before opening a socket.
          '@ | Set-Content -Encoding ascii (Join-Path $bundle "NOTICE.txt")
          Test-Anisette (Join-Path $bundle "sidesign.exe")

      - uses: actions/upload-artifact@v4
        with:
          name: sidesign-windows-x64
          path: signer-bundle/**
