name: signer-tls
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: "10.0.22621.0"

      - name: Setup Swift on Windows
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: "6.1.2"

      - name: Configure Windows SDK module maps
        shell: pwsh
        run: |
          if (Test-Path "$env:LOCALAPPDATA\clang\ModuleCache") {
            Remove-Item -Recurse -Force "$env:LOCALAPPDATA\clang\ModuleCache"
          }
          $share = "$env:SDKROOT\usr\share"
          $ucrtDir = "C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\ucrt"
          $umDir = "C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\um"
          Copy-Item "$share\ucrt.modulemap" "$ucrtDir\module.modulemap" -Force
          Copy-Item "$share\winsdk.modulemap" "$umDir\module.modulemap" -Force
          Copy-Item "$share\ucrt.apinotes" "$ucrtDir\ucrt.apinotes" -Force -ErrorAction SilentlyContinue
          Copy-Item "$share\winsdk.apinotes" "$umDir\winsdk.apinotes" -Force -ErrorAction SilentlyContinue

      - name: Fetch a public page
        shell: pwsh
        run: |
          @'
          import Foundation
          import FoundationNetworking
          @main
          enum Probe {
            static func main() {
              let sem = DispatchSemaphore(value: 0)
              let task = URLSession.shared.dataTask(with: URL(string: "https://www.apple.com")!) { _, response, error in
                if let error { print(error.localizedDescription); exit(1) }
                let status = (response as? HTTPURLResponse)?.statusCode ?? 0
                print(status)
                if status != 200 { exit(1) }
                sem.signal()
              }
              task.resume()
              sem.wait()
            }
          }
          '@ | Set-Content -Encoding ascii probe.swift
          swiftc -o probe.exe probe.swift
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\probe.exe
